<!doctype html>
<!--
  Fuente de public/og-image.png (vista previa al compartir el link, 1200 × 630).
  Para regenerarla, con `npm install` hecho:
  chrome --headless=new --hide-scrollbars --window-size=1200,630 --screenshot=public/og-image.png og/og-image.html
-->
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <title>Imagen para redes — Ignacio Criscenti</title>
    <style>
      @font-face {
        font-family: 'Bricolage';
        src: url('../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2') format('woff2');
        font-weight: 200 800;
      }
      @font-face {
        font-family: 'Atkinson';
        src: url('../node_modules/@fontsource-variable/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-wght-normal.woff2') format('woff2');
        font-weight: 200 800;
      }
      @font-face {
        font-family: 'JetBrains';
        src: url('../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 800;
      }

      :root {
        --bg: #f4f2ed;
        --surface: #ffffff;
        --line: #ddd9d0;
        --line-strong: #c9c4b8;
        --ink: #15171c;
        --muted: #565b66;
        --accent: #c2410c;
        --ok: #166534;
        --ok-soft: #dcf2e3;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--bg);
        font-family: 'Atkinson', system-ui, sans-serif;
        color: var(--ink);
      }
      .dots {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(color-mix(in srgb, var(--ink) 16%, transparent) 1.2px, transparent 1.2px);
        background-size: 24px 24px;
        mask-image: radial-gradient(ellipse 80% 75% at 50% 0%, #000 30%, transparent 80%);
      }
      .glow {
        position: absolute;
        top: -260px;
        left: 50%;
        width: 1100px;
        height: 560px;
        transform: translateX(-50%);
        background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 22%, transparent), transparent);
      }
      .grid {
        position: absolute;
        inset: 48px;
        display: grid;
        grid-template-columns: 1fr 370px;
        gap: 16px;
      }
      .card {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 24px;
        background: var(--surface);
      }
      .intro {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 56px;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        width: fit-content;
        padding: 6px 16px;
        border: 1px solid color-mix(in srgb, var(--ok) 30%, transparent);
        border-radius: 999px;
        background: var(--ok-soft);
        color: var(--ok);
        font-size: 20px;
        font-weight: 700;
      }
      .status::before {
        content: '';
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--ok);
      }
      h1 {
        margin-top: 26px;
        font-family: 'Bricolage', system-ui, sans-serif;
        font-size: 104px;
        font-weight: 800;
        line-height: 0.95;
        letter-spacing: -0.045em;
      }
      h1 span {
        color: var(--accent);
      }
      .role {
        margin-top: 28px;
        font-family: 'Bricolage', system-ui, sans-serif;
        font-size: 34px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .sub {
        margin-top: 6px;
        font-size: 24px;
        color: var(--muted);
      }
      .photo img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 50% 25%;
      }
      .glass {
        position: absolute;
        border: 1px solid color-mix(in srgb, var(--line-strong) 60%, transparent);
        background: color-mix(in srgb, var(--surface) 82%, transparent);
        backdrop-filter: blur(12px) saturate(1.4);
      }
      .pin {
        top: 14px;
        left: 14px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        border-radius: 999px;
        font-size: 18px;
        font-weight: 700;
      }
      .pin svg {
        width: 18px;
        height: 18px;
        color: var(--accent);
      }
      .stack {
        right: 14px;
        bottom: 14px;
        left: 14px;
        padding: 12px 18px;
        border-radius: 16px;
      }
      .stack small {
        display: block;
        font-family: 'JetBrains', monospace;
        font-size: 13px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .stack p {
        margin-top: 2px;
        font-family: 'JetBrains', monospace;
        font-size: 16px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="dots"></div>
    <div class="glow"></div>
    <div class="grid">
      <div class="card intro">
        <p class="status">Disponible para mi primer empleo en IT</p>
        <h1>Ignacio<br />Criscenti<span>.</span></h1>
        <p class="role">Analista en Sistemas Informáticos</p>
        <p class="sub">Estudiante de 4.º año de Ingeniería en Sistemas</p>
      </div>
      <div class="card photo">
        <img src="../src/assets/ignacio-criscenti.jpg" alt="Foto de Ignacio Criscenti" />
        <p class="glass pin">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11Z" /><circle cx="12" cy="10" r="2.5" />
          </svg>
          Rosario, Santa Fe
        </p>
        <div class="glass stack">
          <small>// stack principal</small>
          <p>TypeScript · Next.js · C# · SQL</p>
        </div>
      </div>
    </div>
  </body>
</html>
